name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: margen
          POSTGRES_USER: margen
          POSTGRES_PASSWORD: margen_local_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U margen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://margen:margen_local_only@127.0.0.1:5432/margen
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ci_session_secret_only_for_tests_00000000000000000000
      APP_ORIGIN: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      MP_ACCESS_TOKEN: TEST-000000000000000000000000000000000-0000
      MP_WEBHOOK_SECRET: ci_webhook_secret_only_for_tests
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: margen
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: cisecret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.4}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm --filter api exec prisma migrate deploy
      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck
      - name: Unit and integration tests
        run: pnpm --filter api test && pnpm --filter domain test
      - name: Build all packages and apps
        run: pnpm --filter "./packages/**" run build && pnpm build
      - name: Audit (SCA)
        run: pnpm audit --audit-level=high
      - name: Secret scan (SAST / leak prevention)
        uses: gitleaks/gitleaks-action@v2
      - name: Check for whitespace errors
        run: git diff --check

  e2e-storefront:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: margen
          POSTGRES_USER: margen
          POSTGRES_PASSWORD: margen_local_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U margen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://margen:margen_local_only@127.0.0.1:5432/margen
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_SECRET: ci_session_secret_only_for_tests_00000000000000000000
      APP_ORIGIN: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      MP_ACCESS_TOKEN: TEST-000000000000000000000000000000000-0000
      MP_WEBHOOK_SECRET: ci_webhook_secret_only_for_tests
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: margen
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: cisecret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.4}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}
          restore-keys: |
            playwright-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api exec prisma db seed
      - name: Build API and packages
        run: pnpm --filter "./packages/**" run build && pnpm --filter api build
      - run: pnpm --filter storefront exec playwright install --with-deps chromium
      - name: Start API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          echo "API started"
      - name: Start storefront
        run: |
          cd apps/storefront && npx next start -p 3000 > /tmp/sf.log 2>&1 &
          echo "Storefront started"
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/health > /dev/null && break || sleep 2;
          done
          curl -sf http://127.0.0.1:3000/catalogo > /dev/null || (echo "storefront not up"; cat /tmp/sf.log; exit 1)
      - name: Run storefront E2E
        run: pnpm --filter storefront exec playwright test --project="Desktop Chrome"
